name: Restore verified family portraits

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-portraits.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate original public portraits
        shell: bash
        run: |
          set -euo pipefail
          base="https://cymbalista-family-record-robin-johnsons-projects.vercel.app/assets/portraits"
          temp="$(mktemp -d)"
          for portrait in barbara benjamin dorothy joseph-sidney joseph; do
            curl -fsSL "$base/$portrait.webp" -o "$temp/$portrait.webp"
            test "$(file --brief --mime-type "$temp/$portrait.webp")" = "image/webp"
          done
          mkdir -p dist/assets/portraits
          cp "$temp"/*.webp dist/assets/portraits/
      - name: Commit validated portraits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/portraits
          git commit -m "Restore verified ancestor portraits [skip ci]"
          git push
